<div class="sidebar-inner">
  <div class="sidebar-brand">
    <div class="topbar-logo">2RS</div>
    <div class="sidebar-brand-text">2RS <span>Notas</span></div>
  </div>

  <nav class="sidebar-nav">
    @for (item of items; track item.path) {
      <a
        class="sidebar-link"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.path === '/companies' }"
        (click)="navigate.emit()"
      >
        <i [class]="item.icon"></i>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <span class="text-muted" style="font-size: 0.72rem; padding: 0 0.75rem">
      {{ items.length }} módulos
    </span>
  </div>
</div>
